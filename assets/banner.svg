<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#161e38" />
      <stop offset="60%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="80%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#c471ed" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="slightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .orbit-path { fill: none; stroke: rgba(0, 242, 254, 0.15); stroke-dasharray: 4 6; }
      
      /* Dynamic Keyframe Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }

      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      @keyframes pillBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .floating-bg { animation: floatSlow 8s ease-in-out infinite; transform-origin: center; }
      .pulsing-node { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .data-edge { stroke: #00f2fe; stroke-width: 1.5; stroke-dasharray: 6 6; animation: dashMove 2s linear infinite; }
      .purple-edge { stroke: #c471ed; stroke-width: 1.5; stroke-dasharray: 6 6; animation: dashMove 3s linear reverse infinite; }
      
      .pill-1 { animation: pillBob 5s ease-in-out infinite; }
      .pill-2 { animation: pillBob 6s ease-in-out infinite 1s; }
      .pill-3 { animation: pillBob 5.5s ease-in-out infinite 2s; }
      .pill-4 { animation: pillBob 6.5s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Geometric Grid Matrix -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Ambient Light Orbs (Deep Background) -->
  <circle cx="180" cy="90" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)" />
  <circle cx="1020" cy="270" r="160" fill="#7F00FF" opacity="0.09" filter="url(#glow)" />
  <circle cx="600" cy="180" r="190" fill="#1565C0" opacity="0.06" filter="url(#glow)" />

  <!-- Animated Knowledge Graph Neural Edges (Background Layer) -->
  <g class="floating-bg" opacity="0.6">
    <!-- Connecting Knowledge Edges -->
    <line x1="120" y1="80" x2="260" y2="150" class="data-edge" />
    <line x1="260" y1="150" x2="190" y2="280" class="purple-edge" />
    <line x1="1020" y1="90" x2="940" y2="210" class="data-edge" />
    <line x1="940" y1="210" x2="1080" y2="290" class="purple-edge" />
    <line x1="880" y1="110" x2="1020" y2="90" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
    <line x1="160" y1="210" x2="260" y2="150" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />

    <!-- Left Graph Triples / Nodes -->
    <circle cx="120" cy="80" r="7" fill="url(#neonCyan)" filter="url(#slightGlow)" />
    <circle cx="260" cy="150" r="10" fill="url(#neonViolet)" filter="url(#slightGlow)" />
    <circle cx="190" cy="280" r="8" fill="url(#neonCyan)" filter="url(#slightGlow)" />
    <circle cx="160" cy="210" r="5" fill="#ffffff" opacity="0.8" />

    <!-- Right Graph Triples / Nodes -->
    <circle cx="880" cy="110" r="6" fill="#00f2fe" opacity="0.7" />
    <circle cx="1020" cy="90" r="9" fill="url(#neonViolet)" filter="url(#slightGlow)" />
    <circle cx="940" cy="210" r="11" fill="url(#neonCyan)" filter="url(#slightGlow)" />
    <circle cx="1080" cy="290" r="8" fill="url(#neonViolet)" filter="url(#slightGlow)" />
  </g>

  <!-- Central Dynamic Ambient Waves & Nodes -->
  <g class="pulsing-node">
    <ellipse cx="600" cy="180" rx="360" ry="120" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1" fill="none" stroke-dasharray="8 8" />
    <ellipse cx="600" cy="180" rx="460" ry="150" stroke="rgba(196, 113, 237, 0.1)" stroke-width="1" fill="none" />
  </g>

  <!-- FOREGROUND: Core Title & Subtitle (Crisp, High Contrast, Centered) -->
  <g id="foreground-content">
    <!-- Category Super-Title Pill -->
    <g transform="translate(460, 48)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
      <text x="140" y="19" fill="#00f2fe" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">⚡ AGI CONTEXT &amp; ONTOLOGIES</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="128" fill="url(#textGrad)" font-size="38" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#slightGlow)">
      Semantic Web &amp; Artificial General Intelligence
    </text>

    <!-- Subtitle Definition -->
    <text x="600" y="166" fill="#e2e8f0" font-size="16" font-weight="400" letter-spacing="0.3" text-anchor="middle">
      Enterprise Knowledge Graphs &bull; Neuro-Symbolic AI &bull; OWL/RDF/SHACL Context Fabric
    </text>

    <!-- Foreground Floating Badges / Tags -->
    <g transform="translate(250, 215)" class="pill-1">
      <rect x="0" y="0" width="155" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.2" backdrop-filter="blur(8px)" />
      <circle cx="20" cy="18" r="5" fill="#00f2fe" />
      <text x="34" y="23" fill="#ffffff" font-size="13" font-weight="600">Knowledge Graphs</text>
    </g>

    <g transform="translate(425, 215)" class="pill-2">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(196, 113, 237, 0.4)" stroke-width="1.2" backdrop-filter="blur(8px)" />
      <circle cx="20" cy="18" r="5" fill="#c471ed" />
      <text x="34" y="23" fill="#ffffff" font-size="13" font-weight="600">Neuro-Symbolic AI</text>
    </g>

    <g transform="translate(610, 215)" class="pill-3">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(79, 172, 254, 0.4)" stroke-width="1.2" backdrop-filter="blur(8px)" />
      <circle cx="20" cy="18" r="5" fill="#4facfe" />
      <text x="34" y="23" fill="#ffffff" font-size="13" font-weight="600">GraphRAG &amp; Triples</text>
    </g>

    <g transform="translate(795, 215)" class="pill-4">
      <rect x="0" y="0" width="155" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255, 110, 196, 0.4)" stroke-width="1.2" backdrop-filter="blur(8px)" />
      <circle cx="20" cy="18" r="5" fill="#ff6ec4" />
      <text x="34" y="23" fill="#ffffff" font-size="13" font-weight="600">Deterministic AGI</text>
    </g>

    <!-- Bottom Metrics Bar -->
    <g transform="translate(300, 290)">
      <text x="0" y="16" fill="#94a3b8" font-size="12.5" font-weight="500">
        🌐 <tspan fill="#38bdf8" font-weight="700">W3C Standards</tspan> (RDF/OWL/SHACL/SPARQL)
      </text>
      <text x="310" y="16" fill="#94a3b8" font-size="12.5" font-weight="500">
        🧠 <tspan fill="#a78bfa" font-weight="700">Symbolic Reasoning</tspan> &amp; Datalog
      </text>
      <text x="515" y="16" fill="#94a3b8" font-size="12.5" font-weight="500">
        🛡️ <tspan fill="#34d399" font-weight="700">Zero-Hallucination</tspan> Provenance
      </text>
    </g>
  </g>
</svg>
